<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>坐标系转换 · WGS84 / GCJ02 / BD09</title>
  <style>
    :root { --bg:#0f1a14; --card:#16241c; --line:#28402f; --fg:#e7f0e9; --mut:#8fa89a; --acc:#22c55e; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 28px 18px 60px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: var(--mut); margin: 0 0 22px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    label { display:block; color: var(--mut); font-size: 12px; margin-bottom: 6px; }
    .row { display:flex; gap: 12px; flex-wrap: wrap; }
    .row > div { flex:1 1 160px; }
    input { width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:#0d1712; color:var(--fg); font-family: ui-monospace,Consolas,monospace; }
    button { cursor:pointer; border:1px solid var(--line); background:#1d3327; color:var(--fg); padding:9px 14px; border-radius:8px; font-size:13px; }
    button:hover { border-color: var(--acc); }
    button.primary { background: var(--acc); color:#06210f; border-color: var(--acc); font-weight:600; }
    table { width:100%; border-collapse: collapse; margin-top:6px; }
    th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); font-family: ui-monospace,Consolas,monospace; font-size:13px; }
    th { color: var(--mut); font-weight:500; font-size:12px; }
    .off { color: var(--acc); }
    code { color:#9be29b; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>坐标系转换 · WGS84 / GCJ02 / BD09</h1>
    <p class="sub">GPS / 卫星影像(WGS84) 叠到 高德·腾讯(GCJ02) / 百度(BD09) 必须转，否则偏移几百米。</p>

    <div class="card">
      <div class="row" style="align-items:flex-end">
        <div>
          <label>经度 lng</label>
          <input id="lng" value="126.48" />
        </div>
        <div>
          <label>纬度 lat</label>
          <input id="lat" value="43.95" />
        </div>
        <div style="flex:0 0 auto">
          <button class="primary" id="go">转换</button>
        </div>
      </div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>坐标系</th><th>经度</th><th>纬度</th><th>相对 WGS84 偏移</th></tr></thead>
        <tbody id="out"></tbody>
      </table>
    </div>

    <div class="card">
      <p class="sub" style="margin:0">小实验：把同一个点分别按「WGS84→GCJ02」和「GCJ02→WGS84」来回转，误差 &lt; 1 米。</p>
    </div>
  </div>

  <script src="coord-transform.js"></script>
  <script>
    const T = window.CoordTransform;
    const $ = (id) => document.getElementById(id);

    function fmt(n) { return n.toFixed(6); }

    function run() {
      const lng = parseFloat($('lng').value);
      const lat = parseFloat($('lat').value);
      if (Number.isNaN(lng) || Number.isNaN(lat)) return;

      const wgs = [lng, lat];
      const gcj = T.wgs84ToGcj02(lng, lat);
      const gcjBack = T.gcj02ToWgs84(gcj[0], gcj[1]);
      const bd = T.gcj02ToBd09(gcj[0], gcj[1]);

      const rows = [
        ['WGS84 (GPS/卫星)', wgs, 0],
        ['GCJ02 (高德/腾讯)', gcj, T.distanceMeters(wgs[0], wgs[1], gcj[0], gcj[1])],
        ['BD09 (百度)', bd, T.distanceMeters(wgs[0], wgs[1], bd[0], bd[1])],
      ];
      $('out').innerHTML = rows.map(function (r) {
        const off = r[2] ? '<span class="off">' + r[2].toFixed(0) + ' m</span>' : '—';
        return '<tr><td>' + r[0] + '</td><td>' + fmt(r[1][0]) + '</td><td>' + fmt(r[1][1]) + '</td><td>' + off + '</td></tr>';
      }).join('') +
        '<tr><td colspan="4" style="color:var(--mut)">GCJ02→WGS84 回程误差：' +
        T.distanceMeters(wgs[0], wgs[1], gcjBack[0], gcjBack[1]).toFixed(3) + ' m</td></tr>';
    }

    $('go').addEventListener('click', run);
    $('lng').addEventListener('input', run);
    $('lat').addEventListener('input', run);
    run();
  </script>
</body>
</html>
